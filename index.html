<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3a5f">
<title>大学受験 面接練習</title>
<style>
  :root{
    --navy:#1f3a5f; --navy-2:#2c5282; --cream:#f7f3ea; --paper:#ffffff;
    --ink:#1d2433; --muted:#5b6475; --accent:#e07a2e; --accent-2:#c9621a;
    --green:#2f855a; --red:#c53030; --line:#d9d2c3;
    --radius:22px; --shadow:0 8px 24px rgba(31,58,95,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:20px;line-height:1.6;-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
  .screen{display:none;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom))}
  .screen.active{display:flex;flex-direction:column}

  /* ===== スタート画面 ===== */
  #start{align-items:center;justify-content:center;gap:28px}
  .title{font-size:clamp(34px,5vw,52px);font-weight:800;color:var(--navy);margin:0;text-align:center;letter-spacing:.04em}
  .subtitle{font-size:22px;color:var(--muted);margin:-12px 0 0;text-align:center}
  .count-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;font-size:22px;font-weight:700}
  .seg{display:flex;background:#e9e2d3;border-radius:999px;padding:6px}
  .seg button{min-width:84px;min-height:58px;border-radius:999px;background:transparent;font-size:22px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}
  .modes{display:grid;gap:20px;width:100%;max-width:900px;grid-template-columns:1fr}
  @media (min-width:820px){.modes{grid-template-columns:repeat(3,1fr)}}
  .mode{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;text-align:left;
    border:3px solid transparent;transition:transform .12s,border-color .12s;min-height:180px;display:flex;flex-direction:column;gap:8px}
  .mode:active{transform:scale(.97);border-color:var(--accent)}
  .mode .icon{font-size:44px;line-height:1}
  .mode .name{font-size:28px;font-weight:800;color:var(--navy)}
  .mode .desc{font-size:18px;color:var(--muted);line-height:1.5}

  /* ===== 面接画面 ===== */
  #interview{gap:16px}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .badge{background:var(--navy);color:#fff;border-radius:999px;padding:8px 20px;font-weight:700;font-size:20px}
  .progress{font-size:24px;font-weight:800;color:var(--navy)}
  .spacer{flex:1}
  .quit{background:#e9e2d3;color:var(--muted);min-height:56px;padding:0 22px;border-radius:999px;font-size:19px;font-weight:700}
  .bar{height:10px;background:#e9e2d3;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

  .main{flex:1;display:grid;gap:22px;grid-template-columns:1fr;min-height:0}
  @media (orientation:landscape) and (min-width:900px){.main{grid-template-columns:1.15fr 1fr}}

  .stage{display:flex;flex-direction:column;align-items:center;min-height:0}
  .bubble{position:relative;width:100%;flex:1 1 auto;min-height:230px;max-height:46vh;
    background:var(--paper);border:4px solid var(--navy);border-radius:32px;padding:26px 32px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow)}
  @media (orientation:landscape) and (min-width:900px){.bubble{max-height:none;min-height:300px}}
  .bubble::after,.bubble::before{content:"";position:absolute;left:50%;transform:translateX(-50%);border-style:solid}
  .bubble::before{bottom:-30px;border-width:30px 22px 0 22px;border-color:var(--navy) transparent transparent}
  .bubble::after{bottom:-22px;border-width:24px 17px 0 17px;border-color:var(--paper) transparent transparent}
  .bubble{overflow:visible}
  .bubble-inner{width:100%;max-height:100%;overflow:hidden}
  #qText{margin:0;font-weight:700;line-height:1.55;text-align:left;word-break:break-word;font-size:34px}
  #qText.pop{animation:pop .35s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .avatar{margin-top:36px;width:clamp(170px,24vh,270px);flex:0 0 auto}
  .avatar svg{width:100%;height:auto;display:block}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .mouth{transform-box:fill-box;transform-origin:center;transition:transform .07s}
  .head{transform-box:view-box;transform-origin:120px 150px}
  .nod .head{animation:nod .5s ease-in-out 2}
  /* 一文字ずつ喋る */
  #qText .c{opacity:0;transition:opacity .08s}
  #qText .c.on{opacity:1}
  /* ===== 宇宙人（5%） ===== */
  .avatar .fig{display:none}
  .avatar[data-who="uncle"] #uncleFig,.avatar[data-who="woman"] #womanFig,
  .avatar[data-who="young"] #youngFig,.avatar[data-who="alien"] #alienFig{display:inline}
  /* 面接官えらび */
  .who-btn{width:100%;max-width:900px;display:flex;align-items:center;gap:18px;background:var(--paper);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px 26px 10px 14px;text-align:left;border:3px solid transparent;min-height:96px}
  .who-btn:active{border-color:var(--accent);transform:scale(.99)}
  .who-btn svg{width:76px;height:auto;flex:0 0 auto}
  .wb-text{display:flex;flex-direction:column;flex:1}
  .wb-k{font-size:16px;color:var(--muted)}
  .wb-name{font-size:24px;font-weight:800;color:var(--navy)}
  .wb-go{background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-size:19px;font-weight:800;white-space:nowrap}
  .modal-box.who-box{max-width:860px;display:flex;flex-direction:column;gap:18px}
  .who-box .secondary{min-height:64px}
  .who-title{font-size:22px;font-weight:700;text-align:center}
  .who-title small{font-size:17px;color:var(--muted);font-weight:500}
  .whos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .who{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);border:4px solid transparent;padding:10px 6px 12px;
    display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  .who.on{border-color:var(--accent)}
  .who svg{width:100%;max-width:120px;height:auto}
  .who .wn{font-size:18px;font-weight:800;color:var(--navy)}
  .who .wl{font-size:14px;color:var(--muted)}
  .who.locked svg{filter:brightness(0) opacity(.25)}
  .who.locked .wn{color:var(--muted)}
  .unlock{background:#fff7e6;border:3px solid var(--accent);border-radius:var(--radius);padding:18px 22px;font-size:22px;font-weight:800;color:var(--accent-2);text-align:center;display:none}
  .unlock.show{display:block;animation:pop .4s ease-out}
  .antenna{transform-box:view-box;transform-origin:120px 44px;animation:wobble 2.4s ease-in-out infinite}
  .talking .antenna{animation-duration:.5s}
  @keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .glow{animation:glow 1.2s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.55}to{opacity:1}}
  #interview.alien .bubble{border-color:#2f9e5b;background:#f0fff4}
  #interview.alien .bubble::before{border-top-color:#2f9e5b}
  #interview.alien .bubble::after{border-top-color:#f0fff4}
  #interview.alien .badge{background:#2f9e5b}
  @keyframes nod{50%{transform:rotate(0) translateY(7px)}}

  .answer{display:flex;flex-direction:column;gap:14px;min-height:0}
  .timer{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px 26px}
  .timer .lbl{font-size:19px;opacity:.85}
  .timer .num{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .timer.warn{background:var(--accent-2)}
  textarea{flex:1;min-height:200px;width:100%;resize:none;font-family:inherit;font-size:22px;line-height:1.6;
    padding:20px 22px;border:3px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);outline:none}
  textarea:focus{border-color:var(--navy-2)}
  .meta{display:flex;justify-content:space-between;font-size:18px;color:var(--muted);padding:0 6px}
  .primary{min-height:76px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:26px;font-weight:800;box-shadow:0 6px 0 var(--accent-2);transition:transform .08s}
  .primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-2)}
  .secondary{min-height:70px;border-radius:var(--radius);background:var(--paper);color:var(--navy);font-size:22px;font-weight:800;border:3px solid var(--navy)}

  /* ===== 結果画面 ===== */
  #result{gap:22px;max-width:1000px;margin:0 auto;width:100%}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .stat{background:var(--paper);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);text-align:center}
  .stat .k{font-size:17px;color:var(--muted)}
  .stat .v.t{font-size:21px;line-height:1.4;padding-top:6px}
  .stat .v{font-size:32px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .list{display:flex;flex-direction:column;gap:18px}
  .card{background:var(--paper);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow);border-left:10px solid var(--navy)}
  .card .head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
  .card .no{font-weight:800;color:var(--navy);font-size:20px}
  .card .sec{background:var(--cream);border-radius:999px;padding:4px 16px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
  .card .sec.long{color:var(--red)} .card .sec.fast{color:var(--green)}
  .card .q{font-weight:700;font-size:21px;margin:0 0 12px}
  .card .a{white-space:pre-wrap;background:#faf8f3;border:2px dashed var(--line);border-radius:16px;padding:14px 18px;margin:0;font-size:20px}
  .card .a.empty{color:var(--muted);font-style:italic}
  .card .chars{font-size:16px;color:var(--muted);margin-top:6px;text-align:right}
  .actions{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding-bottom:20px}
  /* ===== 発声練習モード ===== */
  .seg button .sm{font-size:18px}
  #voicePanel{display:none;flex:1;min-height:200px;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--paper);border:3px solid var(--line);border-radius:var(--radius);padding:24px;text-align:center}
  #interview.voice #voicePanel{display:flex}
  #interview.voice #answerInput,#interview.voice .meta{display:none}
  .mic{width:120px;height:120px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
  .mic.rec{background:var(--red)}
  .mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid var(--red);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
  .voice-msg{font-size:24px;font-weight:800;color:var(--navy)}
  .voice-sub{font-size:18px;color:var(--muted)}
  .card audio{width:100%;height:54px}
  .modal{position:fixed;inset:0;background:rgba(20,28,45,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
  .modal.show{display:flex}
  .modal-box{background:var(--paper);border-radius:28px;padding:34px 30px 28px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .2s ease-out}
  #modalMsg{margin:0 0 26px;font-size:24px;font-weight:700;white-space:pre-line;text-align:center;line-height:1.6}
  .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toast{z-index:300;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 28px;border-radius:999px;font-size:20px;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== スタート画面 ===== -->
<section id="start" class="screen active">
  <h1 class="title">🎓 大学受験 面接練習</h1>
  <p class="subtitle">モードを選ぶと面接がスタートします</p>

  <div class="count-box">
    <span>質問数</span>
    <div class="seg" id="countSeg">
      <button data-n="3">3問</button>
      <button data-n="5" class="on">5問</button>
      <button data-n="7">7問</button>
      <button data-n="10">10問</button>
    </div>
  </div>

  <div class="count-box">
    <span>回答方法</span>
    <div class="seg" id="methodSeg">
      <button data-m="text" class="on">✍️ テキスト入力</button>
      <button data-m="voice">🎤 発声練習</button>
    </div>
  </div>

  <div class="modes">
    <button class="mode" data-mode="basic">
      <span class="icon">📘</span><span class="name">王道モード</span>
      <span class="desc">志望理由・自己PR・高校生活で力を入れたことなど、定番の質問</span>
    </button>
    <button class="mode" data-mode="hard">
      <span class="icon">🔥</span><span class="name">意地悪・深掘り</span>
      <span class="desc">「なぜうちじゃないとダメ？」など長文・難問・変化球</span>
    </button>
    <button class="mode" data-mode="mix">
      <span class="icon">🎲</span><span class="name">ランダムミックス</span>
      <span class="desc">王道と意地悪がランダムに混ざった本番形式</span>
    </button>
  </div>

  <button class="who-btn" id="whoBtn">
    <svg id="whoBtnFig" viewBox="20 0 200 270"></svg>
    <span class="wb-text"><span class="wb-k">今の面接官</span><span class="wb-name" id="whoBtnName"></span></span>
    <span class="wb-go">面接官を変更する ▶</span>
  </button>
</section>

<!-- ===== 面接画面 ===== -->
<section id="interview" class="screen">
  <div class="topbar">
    <span class="badge" id="modeBadge">王道モード</span>
    <span class="progress" id="progressText">第1問 / 5</span>
    <span class="spacer"></span>
    <button class="quit" id="soundBtn">🔊 声あり</button>
    <button class="quit" id="quitBtn">中断する</button>
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div class="main">
    <div class="stage">
      <div class="bubble" id="bubble">
        <div class="bubble-inner" id="bubbleInner"><p id="qText"></p></div>
      </div>
      <div class="avatar" id="avatar" data-who="uncle">
        <svg viewBox="0 0 240 270" aria-label="面接官">
         <g id="uncleFig" class="fig">
          <!-- 体・スーツ -->
          <path d="M20 270 C24 210 60 192 120 192 C180 192 216 210 220 270Z" fill="#2d3a4f"/>
          <path d="M96 194 L120 240 L144 194Z" fill="#fff"/>
          <path d="M114 202 L126 202 L130 214 L124 250 L116 250 L110 214Z" fill="#b83232"/>
          <path d="M96 194 L120 240 L84 214Z" fill="#3d4d66"/><path d="M144 194 L120 240 L156 214Z" fill="#3d4d66"/>
          <rect x="106" y="172" width="28" height="26" rx="8" fill="#e8b88c"/>
          <g class="head">
            <!-- 耳 -->
            <ellipse cx="62" cy="118" rx="12" ry="18" fill="#e8b88c"/><ellipse cx="178" cy="118" rx="12" ry="18" fill="#e8b88c"/>
            <!-- 顔 -->
            <ellipse cx="120" cy="112" rx="58" ry="68" fill="#f2c9a0"/>
            <!-- 髪(側頭部だけ・頭頂は薄め) -->
            <path d="M64 108 C60 70 74 50 90 46 C80 62 76 84 78 104Z" fill="#8a8f98"/>
            <path d="M176 108 C180 70 166 50 150 46 C160 62 164 84 162 104Z" fill="#8a8f98"/>
            <path d="M100 48 C110 44 130 44 140 48" stroke="#8a8f98" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- 眉 -->
            <path d="M84 94 Q98 86 110 93" stroke="#5f646d" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M130 93 Q142 86 156 94" stroke="#5f646d" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- 目 -->
            <g class="eyes"><ellipse cx="98" cy="110" rx="5" ry="6" fill="#2b2b2b"/><ellipse cx="142" cy="110" rx="5" ry="6" fill="#2b2b2b"/></g>
            <!-- メガネ -->
            <g stroke="#3a3a3a" stroke-width="3.5" fill="rgba(255,255,255,.18)">
              <rect x="78" y="96" width="38" height="28" rx="9"/><rect x="124" y="96" width="38" height="28" rx="9"/>
            </g>
            <path d="M116 108 L124 108 M78 106 L64 102 M162 106 L176 102" stroke="#3a3a3a" stroke-width="3.5"/>
            <!-- 鼻・頬 -->
            <path d="M120 116 Q114 134 122 138" stroke="#d29c70" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="86" cy="138" rx="9" ry="5" fill="#f0a98a" opacity=".5"/><ellipse cx="154" cy="138" rx="9" ry="5" fill="#f0a98a" opacity=".5"/>
            <!-- ひげ -->
            <path d="M96 148 Q108 140 120 146 Q132 140 144 148 Q132 154 120 150 Q108 154 96 148Z" fill="#6f747d"/>
            <!-- 口 -->
            <ellipse class="mouth" cx="120" cy="160" rx="9" ry="3" fill="#8a3b3b"/>
          </g>
         
         </g>
         <g id="womanFig" class="fig">
          <path d="M20 270 C24 212 62 196 120 196 C178 196 216 212 220 270Z" fill="#5b6b8c"/>
          <path d="M92 198 Q120 230 148 198Z" fill="#fff"/>
          <path d="M92 198 L120 232 L80 218Z" fill="#6f80a3"/><path d="M148 198 L120 232 L160 218Z" fill="#6f80a3"/>
          <circle cx="120" cy="214" r="4" fill="#e9b949"/>
          <rect x="108" y="170" width="24" height="30" rx="9" fill="#f6d3b5"/>
          <g class="head">
            <!-- 後ろ髪（ボブ） -->
            <path d="M58 112 C50 60 82 36 120 36 C158 36 190 60 182 112 L188 176 C172 184 154 180 148 170 L92 170 C86 180 68 184 52 176Z" fill="#4a3328"/>
            <!-- 顔 -->
            <ellipse cx="120" cy="112" rx="52" ry="62" fill="#f8d8bd"/>
            <!-- 前髪（流し） -->
            <path d="M66 104 C62 60 90 42 122 42 C152 42 178 60 174 102 C164 84 148 70 130 64 C120 80 96 94 66 104Z" fill="#4a3328"/>
            <!-- 眉 -->
            <path d="M86 94 Q98 88 110 93" stroke="#4a3328" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M130 93 Q142 88 154 94" stroke="#4a3328" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- 目・まつげ -->
            <g class="eyes">
              <ellipse cx="98" cy="111" rx="5.5" ry="7" fill="#2b2b2b"/><ellipse cx="142" cy="111" rx="5.5" ry="7" fill="#2b2b2b"/>
              <circle cx="100" cy="108" r="1.8" fill="#fff"/><circle cx="144" cy="108" r="1.8" fill="#fff"/>
              <path d="M92.5 107 L87 104 M147.5 107 L153 104" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
            </g>
            <!-- 鼻・頬 -->
            <path d="M120 118 Q117 128 122 130" stroke="#e0a988" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="88" cy="134" rx="9" ry="5" fill="#f4a3a3" opacity=".55"/><ellipse cx="152" cy="134" rx="9" ry="5" fill="#f4a3a3" opacity=".55"/>
            <!-- 口 -->
            <g class="mouth"><ellipse cx="120" cy="150" rx="9" ry="3.4" fill="#c2416b"/><ellipse cx="120" cy="152" rx="4.5" ry="1.4" fill="#f08aa6"/></g>
          </g>
         </g>
         <g id="youngFig" class="fig">
          <path d="M20 270 C24 210 60 194 120 194 C180 194 216 210 220 270Z" fill="#1e3a8a"/>
          <path d="M98 196 L120 238 L142 196Z" fill="#fff"/>
          <path d="M115 204 L125 204 L129 215 L123 250 L117 250 L111 215Z" fill="#60a5fa"/>
          <path d="M98 196 L120 238 L86 214Z" fill="#2848a8"/><path d="M142 196 L120 238 L154 214Z" fill="#2848a8"/>
          <rect x="107" y="170" width="26" height="30" rx="8" fill="#f1c6a0"/>
          <g class="head">
            <!-- 耳 -->
            <ellipse cx="66" cy="118" rx="10" ry="15" fill="#f1c6a0"/><ellipse cx="174" cy="118" rx="10" ry="15" fill="#f1c6a0"/>
            <!-- 顔 -->
            <ellipse cx="120" cy="114" rx="54" ry="63" fill="#f6d0ad"/>
            <!-- 髪（短め・ツンツン前髪） -->
            <path d="M64 108 C56 58 86 34 122 34 C158 34 186 56 176 108 C172 88 166 76 160 70 C150 82 136 84 122 76 C112 88 92 90 80 80 C72 88 68 98 64 108Z" fill="#1f1f24"/>
            <path d="M96 44 L84 30 L108 38Z M124 36 L122 22 L138 36Z M150 44 L162 32 L160 52Z" fill="#1f1f24"/>
            <!-- 眉（太め） -->

<script>
(() => {
  /* ===== 質問データ =====
     [グループ, 質問文]
     同じグループ = ニュアンスが近い質問。1回の面接で同じグループからは1問だけ出ます。 */
  const Q_BASIC = [
    // 志望理由（王道・ミックスでは必ず1問目に出る）
    ["motive", "本学を志望した理由を教えてください。"],
    ["motive", "数ある大学の中で、本学を選んだ理由を教えてください。"],
    ["motive", "本学を志望するようになったきっかけと、その理由を教えてください。"],
    ["motive", "本学のどんなところに一番魅力を感じましたか。志望理由とあわせて教えてください。"],
    ["motive", "この学部・学科を志望した理由を教えてください。"],
    // 入学後にしたいこと
    ["after", "大学に入学したら、どんなことを学びたいですか。"],
    ["after", "本学に入学したら、特に力を入れて取り組みたいことは何ですか。"],
    ["after", "本学のカリキュラムの中で、特に興味のある授業やゼミはありますか。"],
    ["after", "大学の4年間を、どのように過ごしたいと考えていますか。"],
    ["after", "入学後、高校までの経験をどのように活かしていきたいですか。"],
    ["after", "大学では、勉強以外にどんなことに挑戦したいですか。"],
    // 将来の夢・資格
    ["future", "将来の夢や、卒業後に考えている進路について聞かせてください。"],
    ["future", "将来どんな仕事に就きたいですか。そのために、大学で取得したい資格はありますか。"],
    ["future", "大学在学中に取得したい資格や、身につけたいスキルはありますか。それは将来どう役立ちますか。"],
    ["future", "将来、社会の中でどんな役割を果たしたいと考えていますか。"],
    ["future", "今の将来の目標を持つようになったきっかけを教えてください。"],
    // 高校生活で力を入れたこと
    ["effort", "高校生活で最も力を入れて取り組んだことは何ですか。"],
    ["effort", "高校3年間で一番頑張ったことと、そこから学んだことを教えてください。"],
    ["effort", "部活動や委員会活動を通して学んだことを教えてください。"],
    ["effort", "高校生活の中で、自分が一番成長できたと感じる経験を教えてください。"],
    ["effort", "勉強以外で、高校時代に熱中したことはありますか。"],
    // 自己PR・強み
    ["pr", "1分程度で自己PRをしてください。"],
    ["pr", "あなたの強みは何ですか。それが発揮された具体的なエピソードも教えてください。"],
    ["pr", "ほかの受験生には負けないと思うところを教えてください。"],
    ["pr", "あなたの強みを、本学での学びにどう活かせると思いますか。"],
    // 長所・短所・人柄（自己PRにつなげやすい）
    ["trait", "あなたの長所と短所を教えてください。"],
    ["trait", "友人や先生からは、どんな人だと言われることが多いですか。"],
    ["trait", "自分の性格で、一番気に入っているところはどこですか。"],
    ["trait", "自分の短所だと思うところと、それを改善するために努力していることを教えてください。"],
    ["trait", "グループで何かに取り組むとき、あなたはどんな役割を担うことが多いですか。"],
    // その他の定番
    ["book", "最近読んだ本で、印象に残っているものを教えてください。"],
    ["book", "これまでに影響を受けた本や言葉はありますか。"],
    ["hardship", "高校生活で一番苦労したことと、それをどう乗り越えたかを教えてください。"],
    ["hardship", "これまでに失敗した経験と、そこから学んだことを教えてください。"],
    ["interest", "最近、関心を持っていることや興味のある話題はありますか。"],
    ["interest", "志望する分野に関して、最近気になっていることはありますか。"],
    ["people", "高校生活で影響を受けた人はいますか。どんな影響を受けましたか。"],
    ["worry", "大学生活で不安に思っていることはありますか。それをどう乗り越えるつもりですか。"],
    ["stress", "困難やストレスを感じたとき、どうやって気持ちを切り替えていますか。"]
  ].map(([g, t]) => ({ g, t }));
  const Q_HARD = [
    ["motive", "同じ分野を学べる大学は、他にもたくさんありますよね。それでも「うちじゃないとダメ」な理由を、他の大学と比較しながら具体的に説明してください。"],
    ["news", "最近気になったニュースを一つ挙げて、それについてのあなた自身の意見を聞かせてください。また、あなたと反対の意見を持つ人がいたら、どのように説得しますか。"],
    ["fail", "もし本学が不合格だったら、あなたはどうしますか。"],
    ["pr", "あなたの自己PRは、他の受験生からもよく聞く内容だと感じました。あなたにしかない強みを、具体的なエピソード付きで改めて教えてください。"],
    ["pr", "面接官である私を30秒で納得させるつもりで、「あなたを合格させるべき理由」を言ってください。"],
    ["ai", "AIが急速に発達している今、わざわざ大学で4年間学ぶ意味は何だと思いますか。「AIに任せればいい」という意見に、あなたならどう答えますか。"],
    ["future", "10年後、あなたはどこで何をしていると思いますか。その姿と、本学での4年間はどのようにつながっていますか。"],
    ["people", "尊敬する人物を一人挙げてください。そのうえで、その人の考え方や行動の中で「ここは賛成できない」と思う点はありますか。"],
    ["trait", "あなたの短所が原因で、周りに迷惑をかけてしまった経験はありますか。そのとき具体的にどう行動し、何を学びましたか。"],
    ["trait", "自分を一言で表すと何ですか。その言葉を選んだ理由と、逆にその言葉に当てはまらない一面も教えてください。"],
    ["subject", "苦手な科目にはどう向き合ってきましたか。大学の必修科目でその分野が出てきたら、どうやって乗り越えますか。"],
    ["after", "「日本の大学生はあまり勉強しない」とよく言われます。この意見をどう思いますか。そして、あなたはどんな大学生になるつもりですか。"],
    ["regret", "高校生活でやり残したことや、後悔していることはありますか。それを大学でどう活かしますか。"],
    ["group", "グループで意見が対立し、話し合いが全く進まなくなったとします。あなたはどんな役割を果たしますか。実際の経験があれば教えてください。"],
    ["hardship", "これまでで一番大きな失敗は何ですか。言い訳をせずに、何が原因だったと思うか教えてください。"],
    ["critic", "本学について調べてみて、「ここはもっと良くできる」と感じた点はありますか。遠慮せずに教えてください。"],
    ["last", "最後に、あなたから私たち面接官に何か質問はありますか。"]
  ].map(([g, t]) => ({ g, t }));
  const MODE_NAME = { basic:"📘 王道モード", hard:"🔥 意地悪・深掘り", mix:"🎲 ランダムミックス" };

  /* ===== 状態 ===== */
  const $ = id => document.getElementById(id);
  let count = 5, mode = "basic", questions = [], records = [], idx = 0;
  let startAt = 0, tick = null;
  let method = "text";               // "text" | "voice"
  let stream = null, recorder = null, chunks = [], audioType = "";

  try { const c = parseInt(localStorage.getItem("mensetsu_count"), 10); if ([3,5,7,10].includes(c)) count = c; } catch(e) {}
  try { const m = localStorage.getItem("mensetsu_method"); if (m === "text" || m === "voice") method = m; } catch(e) {}

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const jpTime = s => s >= 60 ? `${Math.floor(s/60)}分${String(s%60).padStart(2,"0")}秒（${s}秒）` : `${s}秒`;
  const elapsed = () => Math.floor((Date.now() - startAt) / 1000);

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
    window.scrollTo(0, 0);
  }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

  /* ===== 質問数セレクタ ===== */
  const seg = $("countSeg");
  seg.querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", +b.dataset.n === count);
    b.addEventListener("click", () => {
      count = +b.dataset.n;
      seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      try { localStorage.setItem("mensetsu_count", count); } catch(e) {}
    });
  });

  /* ===== 面接官（クリア回数で解放） ===== */
  const WHO = [
    { id:"uncle", name:"おじさん先生", need:0 },
    { id:"woman", name:"女性の先生",   need:1 },
    { id:"young", name:"若手の先生",   need:2 },
    { id:"alien", name:"宇宙人",       need:3 }
  ];
  const whoName = id => WHO.find(w => w.id === id).name;
  let clears = 0, who = "uncle", actualWho = "uncle";
  try { clears = parseInt(localStorage.getItem("mensetsu_clears"), 10) || 0; } catch(e) {}
  try { const w = localStorage.getItem("mensetsu_who"); if (WHO.some(x => x.id === w)) who = w; } catch(e) {}
  const unlocked = w => clears >= WHO.find(x => x.id === w).need;
  if (!unlocked(who)) who = "uncle";
  const FIG_SVG = id => document.getElementById(id + "Fig").innerHTML;

  function renderWhos() {
    $("clearInfo").textContent = `（クリア ${clears}回）`;
    $("whos").innerHTML = WHO.map(w => {
      const ok = unlocked(w.id);
      return `<button class="who ${ok ? "" : "locked"} ${w.id === who ? "on" : ""}" data-who="${w.id}">
        <svg viewBox="20 0 200 270">${FIG_SVG(w.id)}</svg>
        <span class="wn">${ok ? w.name : "？？？"}</span>
        <span class="wl">${ok ? (w.id === who ? "選択中" : "タップで選択") : `🔒 あと${w.need - clears}回クリア`}</span>
      </button>`;
    }).join("");
    $("whos").querySelectorAll(".who").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.who;
      if (!unlocked(id)) { toast(`あと${WHO.find(x => x.id === id).need - clears}回面接をクリアすると解放されます`); return; }
      who = id;
      try { localStorage.setItem("mensetsu_who", who); } catch(e) {}
      renderWhos();
      setTimeout(() => $("whoModal").classList.remove("show"), 250); // 選んだら閉じる
    }));
    // スタート画面の「面接官を変更する」ボタンの表示
    $("whoBtnFig").innerHTML = FIG_SVG(who);
    $("whoBtnName").textContent = whoName(who);
  }
  renderWhos();
  $("whoBtn").addEventListener("click", () => { renderWhos(); $("whoModal").classList.add("show"); });
  $("whoClose").addEventListener("click", () => $("whoModal").classList.remove("show"));
  $("whoModal").addEventListener("click", e => { if (e.target === $("whoModal")) $("whoModal").classList.remove("show"); });

  /* ===== 回答方法セレクタ ===== */
  const mseg = $("methodSeg");
  mseg.querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.m === method);
    b.addEventListener("click", () => {
      method = b.dataset.m;
      mseg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      try { localStorage.setItem("mensetsu_method", method); } catch(e) {}
    });
  });

  /* ===== 録音（発声練習用） ===== */
  async function prepareMic() {
    if (stream) return true;
    if (!navigator.mediaDevices || !window.MediaRecorder) return false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioType = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
      return true;
    } catch (e) { return false; }
  }
  function releaseMic() {
    if (recorder && recorder.state !== "inactive") { try { recorder.stop(); } catch(e) {} }
    recorder = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
  function startRec() {
    if (!stream) return;
    chunks = [];
    try {
      recorder = audioType ? new MediaRecorder(stream, { mimeType: audioType }) : new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.start();
    } catch (e) { recorder = null; }
  }
  function stopRec() {
    return new Promise(resolve => {
      if (!recorder || recorder.state === "inactive") return resolve(null);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || audioType || "audio/mp4" });
        resolve(blob.size ? URL.createObjectURL(blob) : null);
      };
      recorder.stop();
    });
  }
  function setVoiceUI(recording) {
    $("micIcon").classList.toggle("rec", recording);
    $("voiceMsg").textContent = recording ? "録音中… 声に出して答えてください" : "声に出して答えてください";
    $("voiceSub").textContent = recording
      ? "話し終わったら下のボタンを押してください（録音は結果画面で聞き直せます）"
      : "マイクが使えないため録音なしで進めます。時間だけ計測します";
  }
  function clearOldAudio() { records.forEach(r => r.audio && URL.revokeObjectURL(r.audio)); }

  /* ===== 面接開始 ===== */
  document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => startInterview(b.dataset.mode)));

  // グループが被らないように n 問選ぶ。must のグループは必ず1問目に入れる
  function pickQuestions(pool, n, must) {
    const sh = shuffle(pool), out = [], used = new Set();
    const add = q => { out.push(q); used.add(q.g); };
    if (must) { const m = sh.find(q => q.g === must); if (m) add(m); }
    for (const q of sh) { if (out.length >= n) break; if (!used.has(q.g)) add(q); }
    // グループ数が足りないときだけ、残りから補充
    for (const q of sh) { if (out.length >= n) break; if (!out.includes(q)) out.push(q); }
    // 「最後に質問は？」は必ず最後へ
    const li = out.findIndex(q => q.g === "last");
    if (li > -1 && li !== out.length - 1) out.push(out.splice(li, 1)[0]);
    return out.map(q => q.t);
  }
  function buildQuestions(m) {
    if (m === "basic") return pickQuestions(Q_BASIC, count, "motive");
    if (m === "hard")  return pickQuestions(Q_HARD, count, null);
    return pickQuestions([...Q_BASIC, ...Q_HARD], count, "motive");
  }

  let starting = false;
  async function startInterview(m) {
    if (starting) return;
    starting = true;
    mode = m;
    questions = buildQuestions(m);
    clearOldAudio();
    records = []; idx = 0;
    $("modeBadge").textContent = MODE_NAME[m] + (method === "voice" ? "｜🎤 発声" : "｜✍️ 入力");
    $("interview").classList.toggle("voice", method === "voice");
    actualWho = who;
    isAlien = actualWho === "alien";
    $("avatar").dataset.who = actualWho;
    $("interview").classList.toggle("alien", isAlien);
    initAudio();
    $("nextBtn").textContent = method === "voice" ? "話し終えた / 次の質問へ ▶" : "回答完了 / 次の質問へ ▶";
    if (method === "voice") {
      const ok = await prepareMic();
      if (!ok) toast("マイクが使えないため、録音なしで進みます");
    }
    starting = false;
    show("interview");
    showQuestion();
  }

  /* ===== 喋る演出：一文字ずつ表示＋口パク ===== */
  let isAlien = false, speakTimer = null, audioCtx = null, soundOn = true;
  try { soundOn = localStorage.getItem("mensetsu_sound") !== "off"; } catch(e) {}
  const renderSoundBtn = () => { $("soundBtn").textContent = soundOn ? "🔊 声あり" : "🔇 声なし"; };
  renderSoundBtn();
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn; renderSoundBtn(); initAudio();
    if (!soundOn && voice) { voice.stop(); voice = null; }
    try { localStorage.setItem("mensetsu_sound", soundOn ? "on" : "off"); } catch(e) {}
  });
  function initAudio() {
    // iPadでは音はタップ操作の中で準備する必要がある
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function blip() {
    // 宇宙人の「ピポパ」声
    if (!audioCtx || !soundOn) return;
    try {
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(700 + Math.random() * 700, t);
      o.frequency.exponentialRampToValueAtTime(400 + Math.random() * 300, t + 0.07);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.09);
    } catch (e) {}
  }
  /* ===== おじさんの声（Web Audioで合成） =====
     低いブザー音を「声帯」、2つのフィルターを「口の形」にして、
     文字ごとの母音（あいうえお）に合わせて口の形を変えることで「あー」「おぃ」っぽい声にする */
  const FORMANT = { a:[750,1150], i:[300,2100], u:[340,1250], e:[480,1800], o:[480,850], n:[260,1000] };
  const VOWEL_OF = (() => {
    const t = {
      a:"あかさたなはまやらわがざだばぱぁゃゎ", i:"いきしちにひみりぎじぢびぴぃ", u:"うくすつぬふむゆるぐずづぶぷぅゅ",
      e:"えけせてねへめれげぜでべぺぇ", o:"おこそとのほもよろをごぞどぼぽぉょ", n:"ん"
    }, m = {};
    for (const v in t) for (const ch of t[v]) {
      m[ch] = v;
      m[String.fromCharCode(ch.charCodeAt(0) + 0x60)] = v; // カタカナも同じ母音
    }
    return m;
  })();
  const vowelOf = (ch, prev) => {
    if (ch === "ー") return prev || "a";
    if (ch === "っ" || ch === "ッ") return null;              // 小さい「っ」は無音
    return VOWEL_OF[ch] || "aiueo"[Math.floor(Math.random() * 5)]; // 漢字などはランダム
  };

  // 面接官ごとの声の設定
  //  base:声の高さ(Hz) fm:口の響きの倍率 vib:声の揺れ lp:こもり具合 speed:1文字のミリ秒 fillers:しゃべり出し
  const VOICE = {
    uncle: { base:100, fm:1.00, vib:2.5, lp:2800, vol:.55, speed:60, fillerRate:.75, fillers:["e","a","n"], fillerPitch:.92 },
    woman: { base:225, fm:1.17, vib:4.0, lp:4200, vol:.42, speed:52, fillerRate:.45, fillers:["n","e"],     fillerPitch:1.05 },
    young: { base:150, fm:1.07, vib:1.5, lp:3600, vol:.50, speed:46, fillerRate:.35, fillers:["a","e"],     fillerPitch:1.08 }
  };
  function createVoice(prof) {
    if (!audioCtx || !soundOn || !prof) return null;
    try {
      const ctx = audioCtx, t = ctx.currentTime;
      const base = prof.base * (0.95 + Math.random() * 0.1);
      const src = ctx.createOscillator(); src.type = "sawtooth"; src.frequency.value = base;
      const vib = ctx.createOscillator(); vib.frequency.value = 5;  // 少し揺れる声
      const vibG = ctx.createGain(); vibG.gain.value = prof.vib;
      vib.connect(vibG); vibG.connect(src.frequency);
      const f1 = ctx.createBiquadFilter(); f1.type = "bandpass"; f1.Q.value = 5;
      const f2 = ctx.createBiquadFilter(); f2.type = "bandpass"; f2.Q.value = 7;
      const g1 = ctx.createGain(); g1.gain.value = 1;
      const g2 = ctx.createGain(); g2.gain.value = 0.45;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = prof.lp;
      const out = ctx.createGain(); out.gain.value = 0;
      src.connect(f1); f1.connect(g1); g1.connect(lp);
      src.connect(f2); f2.connect(g2); g2.connect(lp);
      lp.connect(out); out.connect(ctx.destination);
      src.start(t); vib.start(t);
      const VOL = prof.vol;
      return {
        // 母音 v を発音。pitchMul で声の高さ（語尾の上がり下がり）
        say(v, pitchMul = 1) {
          const now = ctx.currentTime, F1 = FORMANT[v][0] * prof.fm, F2 = FORMANT[v][1] * prof.fm;
          f1.frequency.setTargetAtTime(F1, now, 0.02);
          f2.frequency.setTargetAtTime(F2, now, 0.02);
          src.frequency.setTargetAtTime(base * pitchMul * (0.96 + Math.random() * 0.08), now, 0.04);
          // 一瞬だけ音を弱めて「子音で区切られた」感じを出す
          out.gain.cancelScheduledValues(now);
          out.gain.setTargetAtTime(VOL * 0.25, now, 0.006);
          out.gain.setTargetAtTime(v === "n" ? VOL * 0.5 : VOL, now + 0.018, 0.015);
        },
        hush() { const now = ctx.currentTime; out.gain.cancelScheduledValues(now); out.gain.setTargetAtTime(0, now, 0.03); },
        stop() {
          const now = ctx.currentTime;
          out.gain.cancelScheduledValues(now); out.gain.setTargetAtTime(0, now, 0.03);
          src.stop(now + 0.3); vib.stop(now + 0.3);
        }
      };
    } catch (e) { return null; }
  }

  const currentMouth = () => document.querySelector(`#${actualWho}Fig .mouth`);
  function setMouth(open) {
    const m = currentMouth();
    if (m) m.style.transform = `scale(${1 + open * 0.25}, ${0.35 + open * 1.6})`;
  }
  const MOUTH_OPEN = { a:1, o:.8, e:.6, u:.35, i:.3, n:.1 };
  let voice = null;
  function stopSpeaking() {
    clearInterval(speakTimer); speakTimer = null;
    if (voice) { voice.stop(); voice = null; }
    document.querySelectorAll("#qText .c").forEach(c => c.classList.add("on"));
    setMouth(0);
    $("avatar").classList.remove("talking");
  }
  function speak(text) {
    stopSpeaking();
    const qt = $("qText");
    qt.textContent = "";
    const chars = [...text].map(ch => {
      const s = document.createElement("span");
      s.className = "c"; s.textContent = ch; qt.appendChild(s); return s;
    });
    fitBubble(); // 全文を配置してからサイズ調整（途中でレイアウトが動かない）
    $("avatar").classList.add("talking");
    let i = 0, pause = 0, prevV = "a";
    const prof = VOICE[actualWho];
    const speed = isAlien ? 45 : prof.speed; // 1文字あたりのミリ秒
    if (!isAlien) {
      voice = createVoice(prof);
      // しゃべり出しの「えー」「あー」「んー」など（たまに無し）
      if (Math.random() < prof.fillerRate) {
        const filler = prof.fillers[Math.floor(Math.random() * prof.fillers.length)];
        pause = 6;
        setMouth(MOUTH_OPEN[filler] * 0.7);
        if (voice) voice.say(filler, prof.fillerPitch);
      }
    }
    speakTimer = setInterval(() => {
      if (pause > 0) {
        pause--;
        if (pause === 0) { setMouth(0); if (voice) voice.hush(); }
        return;
      }
      if (i >= chars.length) { stopSpeaking(); return; }
      const ch = chars[i].textContent, next = chars[i + 1] ? chars[i + 1].textContent : "";
      chars[i].classList.add("on");
      i++;
      if ("、。？！?!」「（）".includes(ch)) {
        setMouth(0);
        if (voice) voice.hush();
        pause = "。？！?!".includes(ch) ? 7 : 3; // 句読点で口を閉じて一呼吸
        return;
      }
      if (isAlien) {
        setMouth(0.25 + Math.random() * 0.75);
        if (i % 2) blip();
        return;
      }
      const v = vowelOf(ch, prevV);
      if (!v) { setMouth(0.1); if (voice) voice.hush(); return; }
      prevV = v;
      // 語尾の上がり下がり：「〜か？」は上げる、文末は下げる
      let pitch = 1 - Math.min(0.08, i * 0.002);
      if ("？?".includes(next) || (ch === "か" && "。".includes(next))) pitch = 1.22;
      else if ("。".includes(next)) pitch *= 0.88;
      setMouth(MOUTH_OPEN[v] * (0.75 + Math.random() * 0.25));
      if (voice) voice.say(v, pitch);
    }, speed);
  }
  // 吹き出しをタップすると全文をすぐ表示
  $("bubble").addEventListener("click", () => { if (speakTimer) stopSpeaking(); });

  /* ===== 質問表示 + タイマー ===== */
  function showQuestion() {
    const q = questions[idx];
    $("progressText").textContent = `第${idx + 1}問 / ${questions.length}`;
    $("barFill").style.width = (idx / questions.length * 100) + "%";
    speak(q);

    $("answerInput").value = "";
    updateChars();
    if (method === "voice") { startRec(); setVoiceUI(!!recorder); }

    // 表示した瞬間にカウントアップ開始（Date基準なので裏に回っても正確）
    startAt = Date.now();
    clearInterval(tick);
    renderTimer();
    tick = setInterval(renderTimer, 250);
  }

  function renderTimer() {
    const s = elapsed();
    $("timerNum").textContent = mmss(s);
    $("timerBox").classList.toggle("warn", s >= 90);
  }

  // 吹き出しに文字が収まるよう自動でフォントサイズ調整（スクロールさせない）
  function fitBubble() {
    const inner = $("bubbleInner"), qt = $("qText"), bubble = $("bubble");
    let size = Math.max(24, Math.min(42, bubble.clientWidth / 15));
    qt.style.fontSize = size + "px";
    while (inner.scrollHeight > bubble.clientHeight - 52 && size > 18) {
      size -= 1; qt.style.fontSize = size + "px";
    }
  }
  window.addEventListener("resize", () => { if ($("interview").classList.contains("active")) fitBubble(); });

  const updateChars = () => { $("charCount").textContent = $("answerInput").value.length + "文字"; };
  $("answerInput").addEventListener("input", updateChars);

  /* ===== 確認画面（標準のconfirmはアプリ内ブラウザ等でブロックされるため自作） ===== */
  function askConfirm(msg, okLabel = "OK") {
    return new Promise(resolve => {
      const m = $("modal");
      $("modalMsg").textContent = msg;
      $("modalYes").textContent = okLabel;
      m.classList.add("show");
      const done = v => {
        m.classList.remove("show");
        $("modalYes").onclick = $("modalNo").onclick = m.onclick = null;
        resolve(v);
      };
      $("modalYes").onclick = e => { e.stopPropagation(); done(true); };
      $("modalNo").onclick = e => { e.stopPropagation(); done(false); };
      m.onclick = e => { if (e.target === m) done(false); }; // 外側タップでキャンセル
    });
  }

  /* ===== 次へ ===== */
  let busy = false;
  $("nextBtn").addEventListener("click", async () => {
    if (busy) return;
    const ans = method === "text" ? $("answerInput").value.trim() : "";
    let sec = elapsed();
    if (method === "text" && !ans) {
      busy = true;
      const ok = await askConfirm("回答が未入力です。\nこのまま次へ進みますか？", "次へ進む");
      busy = false;
      if (!ok) return;
      sec = elapsed();
    }
    clearInterval(tick);
    stopSpeaking();
    busy = true;
    const audio = method === "voice" ? await stopRec() : null;
    busy = false;
    records.push({ q: questions[idx], a: ans, sec, audio });

    const av = $("avatar");
    av.classList.remove("nod"); void av.offsetWidth; av.classList.add("nod");

    idx++;
    if (idx < questions.length) showQuestion();
    else finish();
  });

  $("quitBtn").addEventListener("click", async () => {
    if (!(await askConfirm("面接を中断してモード選択に戻りますか？\n（ここまでの記録は消えます）", "中断する"))) return;
    clearInterval(tick); stopSpeaking(); releaseMic(); show("start");
  });

  /* ===== 結果 ===== */
  function finish() {
    releaseMic();
    const before = clears;
    clears++;
    try { localStorage.setItem("mensetsu_clears", clears); } catch(e) {}
    const newly = WHO.filter(w => w.need > before && w.need <= clears);
    const um = $("unlockMsg");
    um.textContent = newly.length ? `🎉 新しい面接官「${newly.map(w => w.name).join("・")}」が解放されました！ モード選択画面で選べます` : "";
    um.classList.toggle("show", newly.length > 0);
    renderWhos();
    $("barFill").style.width = "100%";
    const secs = records.map(r => r.sec);
    const total = secs.reduce((a, b) => a + b, 0);
    const avg = Math.round(total / secs.length);
    $("summary").innerHTML = [
      ["モード", MODE_NAME[mode].replace(/^\S+\s/, "") + (method === "voice" ? "（発声）" : "（入力）")],
      ["合計時間", mmss(total)],
      ["平均（1問）", avg + "秒"],
      ["最長", Math.max(...secs) + "秒"],
      ["面接官", whoName(actualWho)]
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v ${/^[\d:]+秒?$/.test(v) ? "" : "t"}">${esc(String(v))}</div></div>`).join("");

    $("resultList").innerHTML = records.map((r, i) => {
      const cls = r.sec >= 120 ? "long" : r.sec <= 30 ? "fast" : "";
      return `<div class="card">
        <div class="head"><span class="no">Q${i + 1}</span><span class="sec ${cls}">⏱ ${jpTime(r.sec)}</span></div>
        <p class="q">${esc(r.q)}</p>
        ${method === "voice"
          ? (r.audio ? `<audio controls preload="metadata" src="${r.audio}"></audio>` : `<p class="a empty">（録音なし・発声のみ）</p>`)
          : `<p class="a ${r.a ? "" : "empty"}">${r.a ? esc(r.a) : "（未回答）"}</p><div class="chars">${r.a.length}文字</div>`}
      </div>`;
    }).join("");
    show("result");
  }

  $("retryBtn").addEventListener("click", () => startInterview(mode));
  $("homeBtn").addEventListener("click", () => show("start"));
  $("copyBtn").addEventListener("click", async () => {
    const text = `【面接練習 ${MODE_NAME[mode]}】\n\n` + records.map((r, i) =>
      `Q${i + 1}. ${r.q}\n⏱ ${jpTime(r.sec)}\nA. ${method === "voice" ? "（発声練習）" : (r.a || "（未回答）")}`).join("\n\n");
    try { await navigator.clipboard.writeText(text); toast("結果をコピーしました"); }
    catch (e) { toast("コピーできませんでした"); }
  });

  // 面接中の誤操作で閉じないように
  window.addEventListener("beforeunload", e => {
    if ($("interview").classList.contains("active")) { e.preventDefault(); e.returnValue = ""; }
  });
})();
</script>
</body>
</html>
